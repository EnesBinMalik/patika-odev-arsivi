<text x="736" y="126" class="m" font-size="11.5" fill="#5A6B88">src/Calculator.java</text>
<text x="736" y="158" class="m" font-size="13" fill="#FBBF24">public class Calculator {</text>
<text x="736" y="184" class="m" font-size="13" fill="#9DB0C8">  private final History history;</text>
<text x="736" y="210" class="m" font-size="13" fill="#9DB0C8"></text>
<text x="736" y="236" class="m" font-size="13" fill="#9DB0C8">  public double apply(Op op, double a, double b) {</text>
<text x="736" y="262" class="m" font-size="13" fill="#FBBF24">    history.push(op, a, b);</text>
<text x="736" y="288" class="m" font-size="13" fill="#9DB0C8">    return op.eval(a, b);</text>
<text x="736" y="314" class="m" font-size="13" fill="#9DB0C8">  }</text>
<text x="736" y="340" class="m" font-size="13" fill="#9DB0C8">}</text>
